name: Pool Practice Overlay APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PoolPracticeOverlay_v3_1_SolidLines.zip'
      - '.github/workflows/pool-practice-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o PoolPracticeOverlay_v3_1_SolidLines.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Generate Gradle wrapper
        working-directory: PoolPracticeOverlay
        run: |
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew

      - name: Build debug APK
        working-directory: PoolPracticeOverlay
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoolPracticeOverlay-debug-APK
          path: PoolPracticeOverlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
