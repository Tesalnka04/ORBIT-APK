name: Build PoolAimOverlay APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PoolAimOverlay_Final.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract the new project
        run: |
          test -f PoolAimOverlay_Final.zip
          mkdir -p PoolAimOverlay
          unzip -o PoolAimOverlay_Final.zip -d PoolAimOverlay

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build debug APK
        working-directory: PoolAimOverlay
        run: |
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoolAimOverlay-debug-APK
          path: PoolAimOverlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
